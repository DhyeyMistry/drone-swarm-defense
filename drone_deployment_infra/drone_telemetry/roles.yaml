# Teams and telemetry defaults for drone_gui. Read at GUI start; teams, rate and
# destinations can all be changed live in the GUI (not written back here).
#
# A drone's team comes from, in order: the GUI's Team selector, `drones:` below by
# name, then `slots:` by its position in the GUI grid (1 = first tile).

slots:
  attack: [1, 2, 3, 4]
  defense: [5, 6, 7, 8]

drones: {}          # e.g.  TELLO-2: defense

# Where each telemetry datagram goes (host:port). Add a LAN host to feed a policy on
# another laptop -- but not a 192.168.10.x address, that's the Tellos' own subnet.
destinations:
  - 127.0.0.1:9100

hz: 10              # datagrams per second (0.5 - 50)
enabled: true
