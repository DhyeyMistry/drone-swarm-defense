<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AprilTag</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: #111; font: 14px/1.3 ui-sans-serif, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; background: #fff; min-height: 0; overflow: auto; }
  canvas { display: block; image-rendering: pixelated; background: #fff; }
  #bar {
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    padding: 10px 14px; border-top: 1px solid #ddd; background: #f6f6f6;
  }
  label { display: flex; align-items: center; gap: 6px; }
  input[type="number"] { width: 5.5rem; font: inherit; padding: 4px 6px; }
  input[type="range"] { width: 140px; }
  button { font: inherit; padding: 4px 10px; cursor: pointer; }
  #meta { margin-left: auto; color: #444; font-variant-numeric: tabular-nums; }
  body.hide-bar #bar { display: none; }
  body.hide-bar { height: 100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="tag" width="10" height="10"></canvas></div>
<div id="bar">
  <label>ID
    <input id="id" type="number" min="0" max="586" value="0">
  </label>
  <button id="prev" type="button">Prev</button>
  <button id="next" type="button">Next</button>
  <label>Black mm
    <input id="mm" type="number" min="8" max="2000" step="1" value="51">
  </label>
  <input id="mmrange" type="range" min="8" max="2000" step="1" value="51" aria-label="Black square millimeters">
  <label><input id="fit" type="checkbox" checked> Fit screen</label>
  <button id="full" type="button">Fullscreen</button>
  <button id="png" type="button">Save PNG</button>
  <span id="meta">tag36h11 · 0</span>
</div>

const BIT_X = [1,2,3,4,5,2,3,4,3,6,6,6,6,6,5,5,5,4,6,5,4,3,2,5,4,3,4,1,1,1,1,1,2,2,2,3];
const BIT_Y = [1,1,1,1,1,2,2,2,3,1,2,3,4,5,2,3,4,3,6,6,6,6,6,5,5,5,4,6,5,4,3,2,5,4,3,4];
const NBITS = 36;
const WIDTH_AT_BORDER = 8;
const TOTAL = 10;

const canvas = document.getElementById("tag");
const idInput = document.getElementById("id");
const mmInput = document.getElementById("mm");
const mmRange = document.getElementById("mmrange");
const fitInput = document.getElementById("fit");
const meta = document.getElementById("meta");
const CSS_PX_PER_MM = 96 / 25.4;
const BLACK_MODULES = WIDTH_AT_BORDER;

function dpr() {
  return window.devicePixelRatio || 1;
}

function clampMm(n) {
  if (!Number.isFinite(n)) return 51;
  return Math.min(2000, Math.max(8, n));
}

function setMmInputs(mm) {
  const v = String(Math.round(clampMm(mm)));
  mmInput.value = v;
  mmRange.value = v;
}

function modulePxForBlackMm(blackMm) {
  const cssPx = (blackMm / BLACK_MODULES) * CSS_PX_PER_MM;
  return Math.max(1, Math.round(cssPx * dpr()));
}

function blackMmForModulePx(m) {
  return (m / dpr()) / CSS_PX_PER_MM * BLACK_MODULES;
}

function cellsFor(id) {
  const code = BigInt("0x" + CODES[id]);
  const cells = new Uint8Array(TOTAL * TOTAL);
  const whiteBorderWidth = WIDTH_AT_BORDER + 2;
  const whiteBorderStart = (TOTAL - whiteBorderWidth) / 2;
  for (let i = 0; i < whiteBorderWidth - 1; i++) {
    cells[whiteBorderStart * TOTAL + whiteBorderStart + i] = 1;
    cells[(whiteBorderStart + i) * TOTAL + TOTAL - 1 - whiteBorderStart] = 1;
    cells[(TOTAL - 1 - whiteBorderStart) * TOTAL + whiteBorderStart + i + 1] = 1;
    cells[(whiteBorderStart + 1 + i) * TOTAL + whiteBorderStart] = 1;
  }
  const borderStart = (TOTAL - WIDTH_AT_BORDER) / 2;
  for (let i = 0; i < NBITS; i++) {
    if ((code >> BigInt(NBITS - i - 1)) & 1n) {
      const x = BIT_X[i] + borderStart;
      const y = BIT_Y[i] + borderStart;
      cells[y * TOTAL + x] = 1;
    }
  }
  return cells;
}

function modulePx() {
  if (!fitInput.checked) return modulePxForBlackMm(clampMm(Number(mmInput.value)));
  const bar = document.getElementById("bar");
  const barH = document.body.classList.contains("hide-bar") ? 0 : bar.offsetHeight;
  const availCss = Math.min(window.innerWidth, window.innerHeight - barH) - 48;
  const availDev = Math.max(TOTAL, availCss * dpr());
  return Math.max(1, Math.floor(availDev / TOTAL));
}

function draw() {
  let id = Number(idInput.value);
  if (!Number.isFinite(id)) id = 0;
  id = Math.max(0, Math.min(CODES.length - 1, Math.trunc(id)));
  idInput.value = String(id);
  const m = modulePx();
  const blackMm = blackMmForModulePx(m);
  if (fitInput.checked) setMmInputs(blackMm);
  const size = TOTAL * m;
  canvas.width = size;
  canvas.height = size;
  const css = size / dpr();
  canvas.style.width = css + "px";
  canvas.style.height = css + "px";
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const cells = cellsFor(id);
  for (let y = 0; y < TOTAL; y++) {
    for (let x = 0; x < TOTAL; x++) {
      ctx.fillStyle = cells[y * TOTAL + x] ? "#fff" : "#000";
      ctx.fillRect(x * m, y * m, m, m);
    }
  }
  meta.textContent = "tag36h11 · id " + id
    + " · black " + blackMm.toFixed(0) + " mm"
    + " · module " + m + " px"
    + " · tag-size " + (blackMm / 1000).toFixed(3) + " m";
  const url = new URL(location.href);
  url.searchParams.set("id", String(id));
  url.searchParams.set("mm", String(Math.round(blackMm)));
  history.replaceState(null, "", url);
}

function onMmEdit() {
  fitInput.checked = false;
  setMmInputs(clampMm(Number(mmInput.value)));
  draw();
}

idInput.addEventListener("input", draw);
mmInput.addEventListener("change", onMmEdit);
mmRange.addEventListener("input", () => {
  mmInput.value = mmRange.value;
  onMmEdit();
});
fitInput.addEventListener("change", draw);
document.getElementById("prev").addEventListener("click", () => { idInput.value = String(Number(idInput.value) - 1); draw(); });
document.getElementById("next").addEventListener("click", () => { idInput.value = String(Number(idInput.value) + 1); draw(); });
document.getElementById("png").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "tag36h11_" + idInput.value + ".png";
  a.click();
});
document.getElementById("full").addEventListener("click", async () => {
  document.body.classList.add("hide-bar");
  draw();
  const el = document.documentElement;
  if (!document.fullscreenElement) await el.requestFullscreen();
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) document.body.classList.remove("hide-bar");
  draw();
});
window.addEventListener("resize", draw);
window.addEventListener("keydown", (e) => {
  if (e.target === idInput || e.target === mmInput) return;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { idInput.value = String(Number(idInput.value) + 1); draw(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") { idInput.value = String(Number(idInput.value) - 1); draw(); }
  if (e.key === "f") document.getElementById("full").click();
  if (e.key === "Escape" && document.body.classList.contains("hide-bar") && !document.fullscreenElement) {
    document.body.classList.remove("hide-bar");
    draw();
  }
});

const params = new URL(location.href).searchParams;
const start = params.get("id");
if (start !== null && start !== "") idInput.value = start;
const startMm = params.get("mm");
if (startMm !== null && startMm !== "") {
  fitInput.checked = false;
  setMmInputs(Number(startMm));
}
draw();
</script>
